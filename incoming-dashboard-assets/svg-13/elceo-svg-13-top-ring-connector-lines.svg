<defs>
  <linearGradient id="grad_orange" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffd28a" stop-opacity="0.98"/>
    <stop offset="36%" stop-color="#ff9b2f" stop-opacity="0.96"/>
    <stop offset="78%" stop-color="#ff6a00" stop-opacity="0.84"/>
    <stop offset="100%" stop-color="#733000" stop-opacity="0.62"/>
  </linearGradient>
  <radialGradient id="grad_node" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fff0bd" stop-opacity="1"/>
    <stop offset="45%" stop-color="#ffab36" stop-opacity="0.95"/>
    <stop offset="80%" stop-color="#ff6a00" stop-opacity="0.34"/>
    <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow_sm" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="1.6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow_md" x="-160%" y="-160%" width="420%" height="420%">
    <feGaussianBlur stdDeviation="5.8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .main { fill:none; stroke:url(#grad_orange); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
    .thin { fill:none; stroke:#ff8a18; stroke-opacity:.28; stroke-width:1.0; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
    .node-core { fill:#090301; stroke:#ff9b2f; stroke-width:1.8; vector-effect:non-scaling-stroke; }
    .node-glow { fill:url(#grad_node); }
    .diamond { fill:#090301; stroke:#ff9b2f; stroke-width:1.7; vector-effect:non-scaling-stroke; }
  </style>
</defs>

