<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="elceo_svg_05_dividers_segmentation_display_safe" width="1200" height="220" viewBox="0 0 1200 220" fill="none" role="img" aria-label="ELCEO SVG-05 top system bar empty structured asset">

<defs>
  <linearGradient id="g_orange_main" x1="0" y1="0" x2="1920" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ff7a10" stop-opacity="0.10"/>
    <stop offset="0.08" stop-color="#ff8a18" stop-opacity="0.90"/>
    <stop offset="0.30" stop-color="#ffb04c" stop-opacity="0.78"/>
    <stop offset="0.55" stop-color="#ff7a10" stop-opacity="0.45"/>
    <stop offset="0.76" stop-color="#ffb04c" stop-opacity="0.74"/>
    <stop offset="0.92" stop-color="#ff8a18" stop-opacity="0.86"/>
    <stop offset="1" stop-color="#ff7a10" stop-opacity="0.10"/>
  </linearGradient>
  <linearGradient id="g_slot_fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff8a18" stop-opacity="0"/>
    <stop offset="0.12" stop-color="#ff8a18" stop-opacity="0.30"/>
    <stop offset="0.50" stop-color="#ffb04c" stop-opacity="0.62"/>
    <stop offset="0.88" stop-color="#ff8a18" stop-opacity="0.30"/>
    <stop offset="1" stop-color="#ff8a18" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="g_dark_plate" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#030201" stop-opacity="0.88"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0.58"/>
  </linearGradient>
  <radialGradient id="g_micro_node" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#fff4c2" stop-opacity="1"/>
    <stop offset="0.42" stop-color="#ff9b2f" stop-opacity="0.94"/>
    <stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
  </radialGradient>
  <filter id="f_orange_glow" x="-50%" y="-70%" width="200%" height="240%">
    <feGaussianBlur stdDeviation="2.4" result="blur"/>
    <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 .45 0 0 .32  0 0 .05 0 0  0 0 0 .70 0" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="f_soft_haze" x="-60%" y="-80%" width="220%" height="260%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
</defs>

