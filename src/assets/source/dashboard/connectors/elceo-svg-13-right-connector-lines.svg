    .node-core { fill:#090301; stroke:#ff9b2f; stroke-width:1.8; vector-effect:non-scaling-stroke; }
    .node-glow { fill:url(#grad_node); }
    .diamond { fill:#090301; stroke:#ff9b2f; stroke-width:1.7; vector-effect:non-scaling-stroke; }
  </style>
</defs>

