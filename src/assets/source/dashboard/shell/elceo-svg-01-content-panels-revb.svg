  .ring-thin { fill:none; stroke:#ff9a26; stroke-opacity:.36; stroke-width:.75; stroke-linecap:round; }
  .ring-faint { fill:none; stroke:#ff7a18; stroke-opacity:.18; stroke-width:.45; stroke-linecap:round; }
</style>


