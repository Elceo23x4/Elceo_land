  <stop offset="0.62" stop-color="#ff8a00" stop-opacity="0.11"/>
  <stop offset="1" stop-color="#ff8a00" stop-opacity="0"/>
</radialGradient>
<linearGradient id="navTabFill" x1="0" x2="1">
  <stop offset="0" stop-color="#150800" stop-opacity="0.98"/>
  <stop offset="1" stop-color="#030201" stop-opacity="0.92"/>
</linearGradient>


