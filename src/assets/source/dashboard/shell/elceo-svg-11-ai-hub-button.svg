<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" fill="none">
<defs>

<filter id="softOrangeGlow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3.5" result="blur"/>
  <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 0.42 0 0 0.38  0 0 0.05 0 0  0 0 0 0.72 0" result="glow"/>
  <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="subtleOrangeGlow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="1.4" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="panelFade" x1="0" x2="1" y1="0" y2="1">
