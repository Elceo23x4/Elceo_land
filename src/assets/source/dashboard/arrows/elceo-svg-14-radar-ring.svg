<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-label="ELCEO SVG-14 radar ring only">
<defs>
    <radialGradient id="green_core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0aff66" stop-opacity="0.10"/>
      <stop offset="65%" stop-color="#00c94d" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="orange_stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd187" stop-opacity="0.92"/>
      <stop offset="30%" stop-color="#ffb13b" stop-opacity="0.96"/>
      <stop offset="78%" stop-color="#ff7a00" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#8e3a00" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="gray_stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d7d3c8" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#ebe7dc" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#bfb9ac" stop-opacity="0.30"/>
    </linearGradient>
    <filter id="orange_glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="green_glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ogrid { fill:none; stroke:#ff8a18; stroke-opacity:.26; vector-effect:non-scaling-stroke; }
      .oglow { fill:none; stroke:url(#orange_stroke); stroke-linecap:round; vector-effect:non-scaling-stroke; filter:url(#orange_glow); }
      .gglow { fill:none; stroke:#00e55d; stroke-linecap:round; vector-effect:non-scaling-stroke; filter:url(#green_glow); }
      .gthin { fill:none; stroke:#00d954; stroke-opacity:.18; vector-effect:non-scaling-stroke; }
      .grayseg { fill:none; stroke:url(#gray_stroke); stroke-linecap:round; vector-effect:non-scaling-stroke; }
    </style>
  </defs>
